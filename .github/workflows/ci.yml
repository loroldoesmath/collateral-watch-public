name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: for f in js/*.js js/views/*.js; do node --check "$f"; done
      - name: Contract test
        run: node tests/contract.test.mjs
      - name: Guard against engine code
        run: sh scripts/guard.sh
      - name: Sample data is reproducible
        run: python tools/generate_sample_data.py | diff -q - sample-data/assessment.json
